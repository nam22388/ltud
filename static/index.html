<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSDL Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e2230;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.12);
    --accent-glow: rgba(74,222,128,0.25);
    --text: #e8eaf0;
    --text-muted: #7a7f94;
    --text-dim: #4a4f64;
    --user-bg: #1a2535;
    --user-border: rgba(99,179,237,0.25);
    --bot-bg: #161e1a;
    --bot-border: rgba(74,222,128,0.18);
    --font: 'Be Vietnam Pro', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: var(--accent-dim);
    border: 1px solid var(--bot-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo svg { width: 18px; height: 18px; stroke: var(--accent); }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-sub {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .btn-reset {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.25s ease;
    max-width: 800px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }

  .avatar.user-av {
    background: rgba(99,179,237,0.15);
    border: 1px solid var(--user-border);
    color: #63b3ed;
  }

  .avatar.bot-av {
    background: var(--accent-dim);
    border: 1px solid var(--bot-border);
    color: var(--accent);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.65;
    max-width: 640px;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-top-right-radius: 3px;
  }

  .msg.bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--bot-border);
    border-top-left-radius: 3px;
  }

  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin: 0; }
  .bubble code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .bubble pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    margin: 8px 0;
  }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
    animation: dot 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Welcome screen */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
  }

  .welcome-icon {
    width: 56px;
    height: 56px;
    background: var(--accent-dim);
    border: 1px solid var(--bot-border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .welcome-icon svg { width: 28px; height: 28px; stroke: var(--accent); }
  .welcome h2 { font-size: 20px; font-weight: 600; }
  .welcome p { color: var(--text-muted); font-size: 14px; max-width: 340px; line-height: 1.6; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .suggestion {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* Input area */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
    max-width: 800px;
    margin: 0 auto;
  }
  .input-wrap:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: var(--font);
    resize: none;
    min-height: 24px;
    max-height: 140px;
    line-height: 1.6;
  }
  #input::placeholder { color: var(--text-dim); }

  #send {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  #send:hover { filter: brightness(1.1); }
  #send:disabled { opacity: 0.3; cursor: not-allowed; filter: none; }
  #send svg { width: 16px; height: 16px; stroke: #0d0f14; }

  .input-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
        <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
      </svg>
    </div>
    <div>
      <div class="header-title">CSDL Assistant</div>
      <div class="header-sub">Cơ sở dữ liệu · RAG · Gemma 2</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="status-dot"></div>
    <button class="btn-reset" onclick="resetChat()">Cuộc hội thoại mới</button>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h2>Xin chào! 👋</h2>
    <p>Tôi là trợ lý học tập môn Cơ sở dữ liệu. Hỏi tôi bất cứ điều gì về môn học này.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="suggest(this)">SQL là gì?</button>
      <button class="suggestion" onclick="suggest(this)">Chuẩn hóa 3NF</button>
      <button class="suggestion" onclick="suggest(this)">Index hoạt động thế nào?</button>
      <button class="suggestion" onclick="suggest(this)">Transaction và ACID</button>
      <button class="suggestion" onclick="suggest(this)">ER diagram là gì?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" placeholder="Hỏi về cơ sở dữ liệu..." rows="1"></textarea>
    <button id="send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter để gửi · Shift+Enter xuống dòng</div>
</div>

<script>
const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

function suggest(btn) {
  inputEl.value = btn.textContent;
  sendMessage();
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function addMsg(role, html) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = `avatar ${role === 'user' ? 'user-av' : 'bot-av'}`;
  av.textContent = role === 'user' ? 'B' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;

  msg.appendChild(av);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';

  const av = document.createElement('div');
  av.className = 'avatar bot-av';
  av.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  msg.appendChild(av);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function formatMarkdown(text) {
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;

  inputEl.value = '';
  autoResize();
  sendBtn.disabled = true;

  addMsg('user', formatMarkdown(text));
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: SESSION_ID })
    });

    const data = await res.json();
    removeTyping();

    if (data.reply) {
      addMsg('bot', formatMarkdown(data.reply));
    } else {
      addMsg('bot', '<span style="color:#f87171">Có lỗi xảy ra, thử lại nhé.</span>');
    }
  } catch (err) {
    removeTyping();
    addMsg('bot', '<span style="color:#f87171">Không kết nối được server. Kiểm tra Flask đang chạy chưa?</span>');
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

async function resetChat() {
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: SESSION_ID })
  });
  messagesEl.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h2>Cuộc hội thoại mới</h2>
      <p>Tôi sẵn sàng giúp bạn ôn tập môn Cơ sở dữ liệu.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="suggest(this)">SQL là gì?</button>
        <button class="suggestion" onclick="suggest(this)">Chuẩn hóa 3NF</button>
        <button class="suggestion" onclick="suggest(this)">Index hoạt động thế nào?</button>
        <button class="suggestion" onclick="suggest(this)">Transaction và ACID</button>
        <button class="suggestion" onclick="suggest(this)">ER diagram là gì?</button>
      </div>
    </div>`;
}
</script>
</body>
</html>
